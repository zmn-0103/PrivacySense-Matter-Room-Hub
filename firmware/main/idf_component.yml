# PrivacySense Matter Room Hub - main component dependencies
#
# Project-local version overrides for components pulled in by esp_matter's
# device HAL. The esp-matter device HAL (esp32c6_devkit_c) declares
# espressif/led_strip: ^1.0.0, but we use led_strip 2.x because:
#   - env_sensor uses the new driver/rmt_rx.h API (ESP-IDF v5.4)
#   - led_strip 1.x uses the legacy driver/rmt.h, which CONFLICTS with
#     driver/rmt_rx.h and triggers `abort()` before app_main() runs:
#       "CONFLICT! driver_ng is not allowed to be used with the legacy driver"
#   - We do NOT use the device HAL's led_driver/button_driver (we manage
#     LED and button ourselves), so the device HAL's led_strip constraint
#     no longer applies once we exclude those component dirs.
#
# This file is consumed by the ESP Component Manager when `idf.py reconfigure`
# runs; it regenerates dependencies.lock. Do NOT hand-edit dependencies.lock.
dependencies:
  espressif/led_strip: "^2.0.0"
