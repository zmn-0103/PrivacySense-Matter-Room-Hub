acceptance:
  - "A clean ESP32-C6 build succeeds against the recorded ESP-IDF and ESP-Matter release/v1.5 toolchain, with all warnings classified."
  - "The EP0/EP1/EP2 topology, device types, cluster IDs, attribute IDs, mode values, and approved offline semantics remain unchanged from docs/matter-data-model.md."
  - "Endpoint 2 exposes exactly Normal=0, Quiet=1, and Night=2 through the ESP-Matter 1.5 SupportedModes API, with empty semantic-tag lists and no unbounded runtime allocation."
  - "The SupportedModesManager uses the locked SDK callback semantics, converts queue/state/timeout failures to an Interaction Model failure before CurrentMode::Set(), and does not pass a transient Matter command context across tasks."
  - "ChangeToMode NIGHT is rejected synchronously by the ESP-Matter SupportedModesManager unless local time is valid and inside the configured night window; the state machine re-checks the same policy after queue delivery."
  - "The explicitly approved Radar FeatureMap is compatible with the locked SDK and is the only Matter data-model delta; the approved occupancy value mapping and local UNKNOWN/offline behavior remain intact."
  - "Build, size, host/static test, and any deferred hardware evidence are recorded against the task commit and toolchain."

